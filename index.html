<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SciSlice</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-200">
<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
 <div class="max-w-5xl mx-auto px-2 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-1 sm:gap-2 text-indigo-600 pl-2 sm:pl-0">
   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 sm:w-6 sm:h-6 transform -rotate-45 hidden sm:block"><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="20" y1="4" x2="8.12" y2="15.88" /><line x1="14.47" y1="14.48" x2="20" y2="20" /><line x1="8.12" y1="8.12" x2="12" y2="12" /></svg>
   <h1 class="text-lg sm:text-xl font-black tracking-tight">SciSlice</h1>
  </div>
  <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
   <button onclick="setTab('slice')" id="tab-btn-slice" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Slice</button>
   <button onclick="setTab('compare')" id="tab-btn-compare" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Compare</button>
   <button onclick="setTab('settings')" id="tab-btn-settings" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Settings</button>
  </div>
 </div>
</header>
<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
 <div id="tab-slice" class="flex flex-col items-center max-w-3xl mx-auto animation-fade-in">
  <div class="w-full bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 sm:mb-8">
   <div class="mb-4">
    <label class="block text-sm font-semibold text-slate-700 mb-2">Analyze any Science Word:</label>
    <form onsubmit="analyzeWord(event)" class="flex gap-2 relative">
     <input type="text" id="customInput" placeholder="e.g. photosynthesis..." class="flex-grow px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" />
     <button type="submit" id="analyzeBtn" disabled class="px-6 py-2.5 bg-slate-800 text-white font-medium rounded-xl hover:bg-slate-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2 text-sm">
      <svg id="searchIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
      <svg id="loaderIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-spin-slow hidden"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <span id="analyzeText">Analyze</span>
     </button>
    </form>
    <p id="errorText" class="text-red-500 text-sm mt-2 hidden"></p>
   </div>
   <div class="h-px w-full bg-slate-100 my-4"></div>
   <label class="block text-sm font-semibold text-slate-700 mb-2">Word Library:</label>
   <div id="presetsContainer" class="flex flex-wrap gap-2 mb-4"></div>
  </div>
  <div class="w-full bg-white p-4 sm:p-8 md:p-16 rounded-3xl shadow-lg border border-slate-200 text-center flex flex-col items-center min-h-[350px] md:min-h-[400px] justify-center relative overflow-hidden">
   <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-20"><div class="absolute -top-24 -left-24 w-64 h-64 rounded-full bg-blue-100 blur-3xl"></div><div class="absolute top-1/2 -right-24 w-64 h-64 rounded-full bg-orange-100 blur-3xl"></div></div>
   <div id="wordInfoContainer" class="z-10 w-full mb-6 sm:mb-8 text-center animate-in"></div>
   <div id="wordBuilderContainer" class="z-10 w-full mb-4 sm:mb-6 overflow-x-auto pt-4 pb-10 sm:pb-12 px-4 no-scrollbar"></div>
   <div id="actionAreaContainer" class="z-10 h-[220px] sm:h-[240px] flex flex-col items-center justify-center w-full px-2 overflow-y-auto no-scrollbar"></div>
   <button onclick="toggleSave()" id="saveBtn" class="absolute top-4 left-4 p-2 transition-colors rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700" title="Save this word"><svg id="saveIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></svg></button>
   <button onclick="resetSlice()" id="resetBtn" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-700 transition-colors rounded-full hover:bg-slate-100 hidden" title="Reset word"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg></button>
  </div>
  <div class="flex flex-wrap justify-center gap-4 sm:gap-6 mt-6 sm:mt-8 text-xs sm:text-sm font-medium text-slate-600 bg-white px-4 sm:px-6 py-3 rounded-xl sm:rounded-full shadow-sm border border-slate-200 w-full sm:w-auto"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-400"></span> Prefix</div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-400"></span> Root</div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-orange-400"></span> Suffix</div></div>
 </div>
 <div id="tab-compare" class="max-w-5xl mx-auto animation-fade-in hidden"><div id="compareNavContainer" class="flex overflow-x-auto gap-2 mb-6 sm:mb-8 pb-2 no-scrollbar"></div><div id="compareCardsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8"></div></div>
 <div id="tab-settings" class="max-w-2xl mx-auto animation-fade-in hidden">
  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
   <div class="p-6 border-b border-slate-100 bg-slate-50/50"><h2 class="text-xl font-bold text-slate-800">App Configuration</h2><p class="text-sm text-slate-500 mt-1">Configure your scientific sources and AI preferences.</p></div>
   <div class="p-6 space-y-8">
    <section><label class="block text-sm font-bold text-slate-700 mb-2">Preferred Dictionary Source</label><select id="sourceSelect" onchange="updateSource(this.value)" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-sm shadow-sm"><option value="Online Etymology Dictionary">Online Etymology Dictionary</option><option value="Oxford English Dictionary">Oxford English Dictionary</option><option value="Merriam-Webster">Merriam-Webster</option><option value="Science Textbook Style">Science Textbook Style (Simplified)</option><option value="AI Expert Analysis">AI Expert Analysis (Deep Context)</option></select></section>
    <section><label class="block text-sm font-bold text-slate-700 mb-2">Gemini API Key</label><div class="flex gap-2"><input type="password" id="apiKeyInput" placeholder="Enter AIzaSy..." class="flex-grow px-4 py-3 rounded-xl border border-slate-300 text-sm shadow-sm" /><button onclick="saveApiKey()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm shadow-md">Save Key</button></div></section>
   </div>
  </div>
 </div>
</main>
<script src="/assets/js/app.js"></script>
</body>
</html>
