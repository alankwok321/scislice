<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>SciSlice</title>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
 .animation-fade-in { animation: fadeIn 0.5s ease-in-out; }
 .animate-in { animation: slideUpFade 0.3s ease-out forwards; }
 .no-scrollbar::-webkit-scrollbar { display: none; }
 .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
 @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
 @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
 .animate-spin-slow { animation: spin 1s linear infinite; }
 </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-200">
<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
 <div class="max-w-5xl mx-auto px-2 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-1 sm:gap-2 text-indigo-600 pl-2 sm:pl-0">
   <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 sm:w-6 sm:h-6 transform -rotate-45 hidden sm:block"><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="20" y1="4" x2="8.12" y2="15.88" /><line x1="14.47" y1="14.48" x2="20" y2="20" /><line x1="8.12" y1="8.12" x2="12" y2="12" /></svg>
   <h1 class="text-lg sm:text-xl font-black tracking-tight">SciSlice</h1>
  </div>
  <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
   <button onclick="setTab('slice')" id="tab-btn-slice" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Slice</button>
   <button onclick="setTab('compare')" id="tab-btn-compare" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Compare</button>
   <button onclick="setTab('settings')" id="tab-btn-settings" class="px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2">Settings</button>
  </div>
 </div>
</header>
<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
 <div id="tab-slice" class="flex flex-col items-center max-w-3xl mx-auto animation-fade-in">
  <div class="w-full bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 sm:mb-8">
   <div class="mb-4">
    <label class="block text-sm font-semibold text-slate-700 mb-2">Analyze any Science Word:</label>
    <form onsubmit="analyzeWord(event)" class="flex gap-2 relative">
     <input type="text" id="customInput" placeholder="e.g. photosynthesis..." class="flex-grow px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" />
     <button type="submit" id="analyzeBtn" disabled class="px-6 py-2.5 bg-slate-800 text-white font-medium rounded-xl hover:bg-slate-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors flex items-center justify-center gap-2 text-sm">
      <svg id="searchIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
      <svg id="loaderIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-spin-slow hidden"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <span id="analyzeText">Analyze</span>
     </button>
    </form>
    <p id="errorText" class="text-red-500 text-sm mt-2 hidden"></p>
   </div>
   <div class="h-px w-full bg-slate-100 my-4"></div>
   <label class="block text-sm font-semibold text-slate-700 mb-2">Word Library:</label>
   <div id="presetsContainer" class="flex flex-wrap gap-2 mb-4"></div>
  </div>
  <div class="w-full bg-white p-4 sm:p-8 md:p-16 rounded-3xl shadow-lg border border-slate-200 text-center flex flex-col items-center min-h-[350px] md:min-h-[400px] justify-center relative overflow-hidden">
   <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-20"><div class="absolute -top-24 -left-24 w-64 h-64 rounded-full bg-blue-100 blur-3xl"></div><div class="absolute top-1/2 -right-24 w-64 h-64 rounded-full bg-orange-100 blur-3xl"></div></div>
   <div id="wordInfoContainer" class="z-10 w-full mb-6 sm:mb-8 text-center animate-in"></div>
   <div id="wordBuilderContainer" class="z-10 w-full mb-4 sm:mb-6 overflow-x-auto pt-4 pb-10 sm:pb-12 px-4 no-scrollbar"></div>
   <div id="actionAreaContainer" class="z-10 h-[220px] sm:h-[240px] flex flex-col items-center justify-center w-full px-2 overflow-y-auto no-scrollbar"></div>
   <button onclick="toggleSave()" id="saveBtn" class="absolute top-4 left-4 p-2 transition-colors rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700" title="Save this word"><svg id="saveIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /></svg></button>
   <button onclick="resetSlice()" id="resetBtn" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-700 transition-colors rounded-full hover:bg-slate-100 hidden" title="Reset word"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg></button>
  </div>
  <div class="flex flex-wrap justify-center gap-4 sm:gap-6 mt-6 sm:mt-8 text-xs sm:text-sm font-medium text-slate-600 bg-white px-4 sm:px-6 py-3 rounded-xl sm:rounded-full shadow-sm border border-slate-200 w-full sm:w-auto"><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-blue-400"></span> Prefix</div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-green-400"></span> Root</div><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-orange-400"></span> Suffix</div></div>
 </div>
 <div id="tab-compare" class="max-w-5xl mx-auto animation-fade-in hidden"><div id="compareNavContainer" class="flex overflow-x-auto gap-2 mb-6 sm:mb-8 pb-2 no-scrollbar"></div><div id="compareCardsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8"></div></div>
 <div id="tab-settings" class="max-w-2xl mx-auto animation-fade-in hidden">
  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
   <div class="p-6 border-b border-slate-100 bg-slate-50/50"><h2 class="text-xl font-bold text-slate-800">App Configuration</h2><p class="text-sm text-slate-500 mt-1">Configure your scientific sources and AI preferences.</p></div>
   <div class="p-6 space-y-8">
    <section><label class="block text-sm font-bold text-slate-700 mb-2">Preferred Dictionary Source</label><select id="sourceSelect" onchange="updateSource(this.value)" class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white text-sm shadow-sm"><option value="Online Etymology Dictionary">Online Etymology Dictionary</option><option value="Oxford English Dictionary">Oxford English Dictionary</option><option value="Merriam-Webster">Merriam-Webster</option><option value="Science Textbook Style">Science Textbook Style (Simplified)</option><option value="AI Expert Analysis">AI Expert Analysis (Deep Context)</option></select></section>
    <section><label class="block text-sm font-bold text-slate-700 mb-2">Gemini API Key</label><div class="flex gap-2"><input type="password" id="apiKeyInput" placeholder="Enter AIzaSy..." class="flex-grow px-4 py-3 rounded-xl border border-slate-300 text-sm shadow-sm" /><button onclick="saveApiKey()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors text-sm shadow-md">Save Key</button></div></section>
   </div>
  </div>
 </div>
</main>
<script>
const DEFAULT_API_KEY = "AIzaSyCMnODVEoNLKdxsI4BurQ6Dp1TivXwy7A4";
const dictionary = {
 microscope:{word:"microscope",fullMeaning:"An optical instrument used for viewing very small objects.",fullMeaningZh:"用於觀察微小物體的光學儀器。",reference:"Online Etymology Dictionary",parts:[{text:"micro",type:"prefix",meaning:"small",meaningZh:"微小"},{text:"scope",type:"root",meaning:"instrument for viewing",meaningZh:"觀察儀器"}]},
 telescope:{word:"telescope",fullMeaning:"An optical instrument designed to make distant objects appear nearer.",fullMeaningZh:"設計用來使遠處物體顯得更近的光學儀器。",reference:"Online Etymology Dictionary",parts:[{text:"tele",type:"prefix",meaning:"far, distant",meaningZh:"遙遠"},{text:"scope",type:"root",meaning:"instrument for viewing",meaningZh:"觀察儀器"}]},
 biology:{word:"biology",fullMeaning:"The study of living organisms and their vital processes.",fullMeaningZh:"對生物體及其生命過程的研究。",reference:"Online Etymology Dictionary",parts:[{text:"bio",type:"root",meaning:"life",meaningZh:"生命"},{text:"logy",type:"suffix",meaning:"study of",meaningZh:"對...的研究"}]},
 geology:{word:"geology",fullMeaning:"The study of the earth's physical structure and substance.",fullMeaningZh:"對地球物理結構和物質的研究。",reference:"Online Etymology Dictionary",parts:[{text:"geo",type:"root",meaning:"earth",meaningZh:"地球"},{text:"logy",type:"suffix",meaning:"study of",meaningZh:"對...的研究"}]}
};
const comparePairs=[{id:'scopes',title:'Microscope vs Telescope',words:['microscope','telescope']},{id:'ologies',title:'Biology vs Geology',words:['biology','geology']}];
let state={activeTab:'slice',currentWordId:'microscope',isSliced:false,selectedPart:null,customWords:JSON.parse(localStorage.getItem('sciSlice_customWords'))||{},savedWords:JSON.parse(localStorage.getItem('sciSlice_savedWords'))||[],currentPairId:'scopes',selectedSource:localStorage.getItem('sciSlice_selectedSource')||'Online Etymology Dictionary',apiKey:localStorage.getItem('sciSlice_apiKey')||DEFAULT_API_KEY};
function getAllWords(){return {...dictionary,...state.customWords};}
function updateSource(val){state.selectedSource=val;localStorage.setItem('sciSlice_selectedSource',val);}
function saveApiKey(){const input=document.getElementById('apiKeyInput');if(input.value.trim()){state.apiKey=input.value.trim();localStorage.setItem('sciSlice_apiKey',state.apiKey);alert('API Key saved successfully!');}}
function setTab(tab){state.activeTab=tab;['slice','compare','settings'].forEach(t=>{const btn=document.getElementById(`tab-btn-${t}`);const content=document.getElementById(`tab-${t}`);if(t===tab){btn.className='px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2 bg-white text-indigo-700 shadow-sm';content.classList.remove('hidden');}else{btn.className='px-2 sm:px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all flex items-center gap-1 sm:gap-2 text-slate-600 hover:text-slate-900';content.classList.add('hidden');}});renderAll();}
function setCurrentWord(wordId){state.currentWordId=wordId;state.isSliced=false;state.selectedPart=null;renderPresets();renderWordInfo();renderPartDetails();updateSaveIcon();}
function handleSlice(){state.isSliced=true;state.selectedPart=null;updateSliceVisuals();renderPartDetails();}
function resetSlice(){state.isSliced=false;state.selectedPart=null;updateSliceVisuals();renderPartDetails();}
function selectPart(index){if(!state.isSliced)return;const wordData=getAllWords()[state.currentWordId];state.selectedPart=wordData.parts[index];renderPartDetails();}
function toggleSave(){if(state.savedWords.includes(state.currentWordId))state.savedWords=state.savedWords.filter(w=>w!==state.currentWordId);else state.savedWords.push(state.currentWordId);localStorage.setItem('sciSlice_savedWords',JSON.stringify(state.savedWords));renderPresets();updateSaveIcon();}
function updateSaveIcon(){const btn=document.getElementById('saveBtn');const icon=document.getElementById('saveIcon');const isSaved=state.savedWords.includes(state.currentWordId);if(isSaved){btn.classList.add('text-indigo-600');btn.classList.remove('text-slate-400');icon.setAttribute('fill','currentColor');}else{btn.classList.remove('text-indigo-600');btn.classList.add('text-slate-400');icon.setAttribute('fill','none');}}
function getPartStyles(type,isSliced){if(!isSliced)return 'text-slate-800 bg-transparent border-transparent';switch(type){case 'prefix':return 'bg-blue-100 text-blue-800 border-blue-300 shadow-sm';case 'root':return 'bg-green-100 text-green-800 border-green-300 shadow-sm';case 'suffix':return 'bg-orange-100 text-orange-800 border-orange-300 shadow-sm';default:return 'bg-gray-100 text-gray-800 border-gray-300 shadow-sm';}}
function getPartLabel(type){switch(type){case 'prefix':return 'Prefix';case 'root':return 'Root';case 'suffix':return 'Suffix';default:return 'Part';}}
const icons={bookOpen:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,scissors:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>`,info:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`,volume:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`};
function generateWordBuilderHTML(wordData,interactive=true){const gapClass=(state.isSliced||!interactive)?'gap-1 sm:gap-2 md:gap-4':'gap-0';let partsHTML=wordData.parts.map((part,index)=>{const styles=getPartStyles(part.type,state.isSliced||!interactive);let borderRadius='16px';if(!state.isSliced&&interactive){if(wordData.parts.length===1)borderRadius='16px';else if(index===0)borderRadius='16px 0 0 16px';else if(index===wordData.parts.length-1)borderRadius='0 16px 16px 0';else borderRadius='0';}const labelOpacity=(state.isSliced||!interactive)?'opacity-100':'opacity-0';const labelColor=part.type==='prefix'?'text-blue-500':part.type==='root'?'text-green-500':'text-orange-500';const onClickEvent=interactive?`onclick="selectPart(${index})"`:'';return `<div ${onClickEvent} class="word-slice-part relative flex flex-col items-center justify-center px-2 sm:px-3 md:px-4 py-2 sm:py-3 md:py-6 rounded-xl border-2 text-2xl sm:text-4xl md:text-6xl font-black tracking-wide lowercase transition-all duration-500 ease-in-out ${interactive?'cursor-pointer hover:scale-105':''} ${styles}" style="border-radius:${borderRadius}">${part.text}<div class="part-label absolute -bottom-5 md:-bottom-6 text-[10px] sm:text-xs md:text-sm font-bold tracking-wider uppercase transition-opacity duration-300 delay-300 ${labelOpacity} ${labelColor}">${getPartLabel(part.type)}</div></div>`;}).join('');return `<div class="word-builder-wrapper flex justify-center items-center transition-all duration-500 ease-in-out w-max mx-auto ${gapClass}">${partsHTML}</div>`;}
function updateSliceVisuals(){const wrapperContainer=document.getElementById('wordBuilderContainer');if(!wrapperContainer||!wrapperContainer.firstElementChild)return;const wrapper=wrapperContainer.firstElementChild;if(state.isSliced){wrapper.classList.remove('gap-0');wrapper.classList.add('gap-1','sm:gap-2','md:gap-4');}else{wrapper.classList.remove('gap-1','sm:gap-2','md:gap-4');wrapper.classList.add('gap-0');}const parts=wrapper.children;const wordData=getAllWords()[state.currentWordId];for(let i=0;i<parts.length;i++){const partEl=parts[i];const partType=wordData.parts[i].type;if(state.isSliced)partEl.style.borderRadius='16px';else{if(parts.length===1)partEl.style.borderRadius='16px';else if(i===0)partEl.style.borderRadius='16px 0 0 16px';else if(i===parts.length-1)partEl.style.borderRadius='0 16px 16px 0';else partEl.style.borderRadius='0';}const slicedClasses=getPartStyles(partType,true).split(' ').filter(Boolean);const unslicedClasses=getPartStyles(partType,false).split(' ').filter(Boolean);if(state.isSliced){partEl.classList.remove(...unslicedClasses);partEl.classList.add(...slicedClasses);const label=partEl.querySelector('.part-label');if(label){label.classList.remove('opacity-0');label.classList.add('opacity-100');}}else{partEl.classList.remove(...slicedClasses);partEl.classList.add(...unslicedClasses);const label=partEl.querySelector('.part-label');if(label){label.classList.remove('opacity-100');label.classList.add('opacity-0');}}}}
function renderPresets(){const container=document.getElementById('presetsContainer');const allKeys=Object.keys(getAllWords());container.innerHTML=allKeys.map(key=>{const isCurrent=state.currentWordId===key;const isSaved=state.savedWords.includes(key);let btnClass='px-4 py-2 rounded-lg text-sm font-medium capitalize transition-all flex items-center gap-2 border ';if(isCurrent)btnClass+='bg-indigo-600 text-white border-indigo-600 shadow-md';else if(isSaved)btnClass+='bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100';else btnClass+='bg-slate-100 text-slate-700 border-transparent hover:bg-slate-200';return `<button onclick="setCurrentWord('${key}')" class="${btnClass}"><span>${key}</span></button>`;}).join('');}
function renderWordInfo(){const wordData=getAllWords()[state.currentWordId];if(!wordData)return;document.getElementById('wordInfoContainer').innerHTML=`<h2 class="text-2xl sm:text-3xl font-black text-slate-800 capitalize mb-3 tracking-tight flex items-center justify-center gap-3"><span>${wordData.word}</span><button onclick="playAudio('${wordData.word}', event.currentTarget)" class="text-slate-400 hover:text-indigo-600 transition-colors p-1.5 rounded-full hover:bg-indigo-50 flex-shrink-0"><span class="w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center">${icons.volume}</span></button></h2><p class="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto font-medium leading-relaxed px-2">${wordData.fullMeaning}</p><p class="text-slate-500 text-sm sm:text-base max-w-2xl mx-auto mt-1 px-2 mb-4">${wordData.fullMeaningZh}</p>`;document.getElementById('wordBuilderContainer').innerHTML=generateWordBuilderHTML(wordData,true);}
function renderPartDetails(){const container=document.getElementById('actionAreaContainer');const resetBtn=document.getElementById('resetBtn');if(!state.isSliced){resetBtn.classList.add('hidden');container.innerHTML=`<button onclick="handleSlice()" class="group relative inline-flex items-center justify-center gap-2 sm:gap-3 px-6 sm:px-8 py-3 sm:py-4 bg-indigo-600 text-white font-bold rounded-full overflow-hidden transition-transform hover:scale-105 active:scale-95 shadow-xl hover:shadow-indigo-500/30 w-full max-w-[280px]"><span class="w-5 h-5">${icons.scissors}</span><span>Slice Word</span></button>`;}else{resetBtn.classList.remove('hidden');const wordData=getAllWords()[state.currentWordId];if(state.selectedPart){container.innerHTML=`<div class="w-full max-w-lg animate-in"><div class="p-5 sm:p-6 rounded-xl text-left border-l-4 shadow-sm bg-white"><h4 class="font-bold text-base sm:text-lg mb-4 capitalize flex items-start gap-3 flex-wrap leading-tight"><span>${state.selectedPart.text}-</span><span class="text-[10px] sm:text-xs font-normal text-slate-500 uppercase tracking-wider bg-slate-100 px-2 py-0.5 rounded-md">${getPartLabel(state.selectedPart.type)}</span></h4><div><p class="text-sm sm:text-base text-slate-700 leading-relaxed mb-1.5">${state.selectedPart.meaning}</p><p class="text-sm text-slate-500 leading-relaxed">${state.selectedPart.meaningZh}</p></div></div></div>`;}else{container.innerHTML=`<div class="w-full max-w-lg animate-in"><div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-500 flex items-start justify-center gap-3 animate-pulse text-sm sm:text-base"><span class="w-5 h-5">${icons.info}</span><span>Tap on a colored slice to reveal its meaning.</span></div></div>`;}}}
function renderCompareTab(){const navContainer=document.getElementById('compareNavContainer');navContainer.innerHTML=comparePairs.map(pair=>`<button onclick="setComparePair('${pair.id}')" class="flex-shrink-0 px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 ${state.currentPairId===pair.id?'bg-slate-800 text-white shadow-md':'bg-white text-slate-600 border border-slate-200 hover:border-slate-300 hover:bg-slate-50'}"><span>${pair.title}</span></button>`).join('');const cardsContainer=document.getElementById('compareCardsContainer');const activePair=comparePairs.find(p=>p.id===state.currentPairId);cardsContainer.innerHTML=activePair.words.map(wordKey=>{const wordData=getAllWords()[wordKey];return `<div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full"><div class="bg-slate-50 border-b border-slate-100 p-4 sm:p-8 pt-6 pb-10 sm:pb-12 flex flex-col items-center justify-center min-h-[160px] sm:min-h-[200px] overflow-x-auto no-scrollbar">${generateWordBuilderHTML(wordData,false)}</div><div class="p-5 sm:p-6 md:p-8 flex-grow"><h3 class="text-xl sm:text-2xl font-bold text-slate-900 capitalize mb-3">${wordData.word}</h3><p class="text-sm sm:text-base text-slate-600 mb-1 font-medium leading-relaxed">${wordData.fullMeaning}</p><p class="text-xs sm:text-sm text-slate-500 mb-4 leading-relaxed">${wordData.fullMeaningZh}</p></div></div>`;}).join('');}
function renderSettings(){document.getElementById('sourceSelect').value=state.selectedSource;document.getElementById('apiKeyInput').value=state.apiKey;}
function setComparePair(pairId){state.currentPairId=pairId;renderCompareTab();}
function renderAll(){if(state.activeTab==='slice'){renderPresets();renderWordInfo();renderPartDetails();updateSaveIcon();}else if(state.activeTab==='compare'){renderCompareTab();}else{renderSettings();}}
const customInput=document.getElementById('customInput');const analyzeBtn=document.getElementById('analyzeBtn');customInput.addEventListener('input',(e)=>{analyzeBtn.disabled=e.target.value.trim().length===0||document.getElementById('analyzeText').innerText==='Analyzing...';});
async function analyzeWord(e){e.preventDefault();const cleanWord=customInput.value.trim().toLowerCase();if(!cleanWord)return;const errorEl=document.getElementById('errorText');errorEl.classList.add('hidden');const allWords=getAllWords();if(allWords[cleanWord]){customInput.value='';setCurrentWord(cleanWord);return;}const submitBtn=document.getElementById('analyzeBtn');submitBtn.disabled=true;document.getElementById('searchIcon').classList.add('hidden');document.getElementById('loaderIcon').classList.remove('hidden');document.getElementById('analyzeText').innerText='Analyzing...';customInput.disabled=true;const prompt=`Analyze the science word "${cleanWord}" using the data style and definitions of ${state.selectedSource}. If the input contains a typo, automatically correct it to the most likely intended valid scientific term. Break it down into morphological parts (prefix, root, suffix). Output ONLY valid JSON.`;const payload={contents:[{parts:[{text:prompt}]}],systemInstruction:{parts:[{text:'Expert science lexicographer. Valid JSON only.'}]},generationConfig:{responseMimeType:'application/json'}};const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();let text=data.candidates?.[0]?.content?.parts?.[0]?.text||'{}';text=text.replace(/```json/g,'').replace(/```/g,'').trim();const result=JSON.parse(text);const correctedWord=result.word.toLowerCase();state.customWords[correctedWord]=result;localStorage.setItem('sciSlice_customWords',JSON.stringify(state.customWords));customInput.value='';setCurrentWord(correctedWord);}catch(err){errorEl.innerText=`Analysis failed: ${err.message}.`;errorEl.classList.remove('hidden');}finally{submitBtn.disabled=customInput.value.trim().length===0;document.getElementById('searchIcon').classList.remove('hidden');document.getElementById('loaderIcon').classList.add('hidden');document.getElementById('analyzeText').innerText='Analyze';customInput.disabled=false;customInput.focus();}}
renderAll();setTab('slice');
</script>
